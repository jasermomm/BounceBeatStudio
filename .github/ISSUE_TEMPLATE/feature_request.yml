name: Feature request
description: Suggest a focused improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or workflow
      description: Explain what is difficult or impossible today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the user-facing behavior and controls.
    validations:
      required: true
  - type: textarea
    id: determinism
    attributes:
      label: Determinism and performance considerations
      description: Explain how the feature should behave during preview and offline rendering.
