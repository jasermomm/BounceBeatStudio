name: Bug report
description: Report a reproducible problem in BounceBeat Studio
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Remove personal paths, copyrighted MIDI, and secrets from logs before posting.
  - type: input
    id: version
    attributes:
      label: BounceBeat Studio version
      placeholder: 1.5.2
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and Python version
      placeholder: Windows 11, Python 3.11.9
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the actual behavior and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open preset...
        2. Change...
        3. Press...
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Relevant backend
      options:
        - Native Pymunk physics
        - Deterministic fallback physics
        - Built-in synthesizer
        - FluidSynth or SoundFont
        - FFmpeg export
        - Unknown
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or traceback
      render: text
