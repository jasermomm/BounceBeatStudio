[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bouncebeat-studio"
version = "1.5.4"
description = "A desktop studio for deterministic musical 2D physics simulations with collision-triggered MIDI and video export."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "BounceBeat Studio Contributors"}]
keywords = ["midi", "physics", "animation", "video", "pyside6", "pymunk", "ffmpeg"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Multimedia :: Sound/Audio :: MIDI",
]
dependencies = [
  "PySide6>=6.8,<7",
  "pymunk>=7.0,<8",
  "mido>=1.3,<2",
  "pretty-midi>=0.2.11,<1",
  "numpy>=1.26,<3",
  "soundfile>=0.12,<1",
  "platformdirs>=4,<5",
]

[project.optional-dependencies]
fluidsynth = ["pyfluidsynth>=1.3.3,<2"]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.9,<1"]
build = ["pyinstaller>=6.12,<7", "Pillow>=10,<13", "build>=1.2,<2"]

[project.scripts]
bouncebeat = "bouncebeat.main:main"
bouncebeat-render = "bouncebeat.render:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bouncebeat = ["assets/*", "assets/**/*", "assets/**/**/*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
